<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<title>摄像头回放台</title>
<script>
/* 首屏前应用配色，避免闪一下默认色 */
try {
  var t = localStorage.getItem("cam.theme");
  if (t) document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📹</text></svg>">
</head>
<body>

<div class="app">

  <aside class="side" id="side">
    <div class="brand">
      <div class="brand-dot" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="13" height="12" rx="2.5"/>
          <path d="M15 10.5l6-3.5v10l-6-3.5"/>
        </svg>
      </div>
      <div class="brand-txt">
        <b>回放台</b>
        <span id="camName">读取中…</span>
      </div>
      <button class="icon-btn only-mobile" id="btnSideClose" title="收起">✕</button>
    </div>

    <div class="side-stat" id="sideStat"></div>

    <div class="side-filter">
      <div class="side-title">录像日期</div>
      <div class="day-search">
        <span>🔍</span>
        <input id="daySearch" type="text" placeholder="筛选：11-1 / 11-19" autocomplete="off" spellcheck="false">
        <button class="clear-btn" id="daySearchClear" title="清空" hidden>✕</button>
      </div>
      <div class="chips" id="dayChips">
        <button class="chip on" data-f="all">全部</button>
        <button class="chip" data-f="7">近 7 天</button>
        <button class="chip" data-f="30">近 30 天</button>
        <button class="chip" data-f="long">长录像</button>
      </div>
      <div class="filter-count" id="filterCount"></div>
    </div>

    <div class="side-scroll">
      <div class="days" id="days"></div>
      <div class="days-empty" id="daysEmpty" hidden>没有符合条件的日子</div>
    </div>

    <div class="side-foot">
      <button class="ghost-btn" id="btnFolder2">更换文件夹</button>
      <button class="ghost-btn" id="btnRefresh">重新扫描</button>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <button class="icon-btn only-mobile" id="btnSideOpen" title="日期列表">☰</button>
      <div class="day-title">
        <h1 id="dayLabel">—</h1>
        <span id="dayMeta"></span>
      </div>
      <div class="top-right">
        <button class="folder-btn" id="btnFolder" title="更换录像文件夹">
          <span class="f-ico">📁</span>
          <span class="f-name" id="folderName">选择文件夹</span>
        </button>
        <label class="jump">
          <span>定位</span>
          <input id="jumpTime" type="text" placeholder="16:20" autocomplete="off" spellcheck="false">
        </label>
        <div class="theme-wrap">
          <button class="icon-btn" id="btnTheme" title="配色">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round">
              <circle cx="12" cy="12" r="8.6"/>
              <path d="M12 3.4a8.6 8.6 0 000 17.2z" fill="currentColor" stroke="none" opacity=".55"/>
            </svg>
          </button>
          <div class="theme-pop" id="themePop" hidden>
            <div class="theme-pop-title">界面配色</div>
            <div class="theme-grid" id="themeGrid"></div>
          </div>
        </div>
        <button class="icon-btn" id="btnExport" title="导出为单个 mp4">⤓</button>
      </div>
    </header>

    <section class="stage">
      <div class="player" id="player">
        <video id="video" playsinline preload="auto" muted></video>
        <img class="player-cover hide" id="playerCover" alt="" draggable="false">
        <button class="player-bigplay hide" id="playerBigPlay" title="播放">▶</button>
        <div class="player-hint hide" id="playerHint"></div>

        <div class="player-msg" id="playerMsg">
          <div class="spin" id="msgSpin"></div>
          <p id="msgText">正在读取…</p>
        </div>

        <div class="player-badge" id="playerBadge"></div>
        <div class="player-osd" id="osd"></div>
      </div>
    </section>

    <section class="mobile-info">
      <div class="mi-day" id="miDate">—</div>
      <ul class="mi-facts" id="miFacts"></ul>
      <p class="mi-tip">点时间轴任意位置开始播放<br>落在空档会自动跳到下一段有录像的位置</p>
    </section>

    <section class="timeline-wrap">
      <div class="tl-head">
        <div class="tl-clock" id="tlClock">--:--:--</div>
        <div class="tl-gap" id="tlGap"></div>
      </div>

      <div class="timeline" id="timeline">
        <canvas id="tlCanvas"></canvas>
        <div class="tl-cursor" id="tlCursor"></div>
        <div class="tl-hover" id="tlHover"><span class="tl-hover-time"></span></div>
      </div>

      <div class="tl-scale" id="tlScale"></div>
    </section>

    <section class="controls">
      <div class="ctrl-group">
        <button class="icon-btn" id="btnPrev" title="上一段 (←)">⏮</button>
        <button class="icon-btn" id="btnBack10" title="后退 10 秒 (J)">↺10</button>
        <button class="play-btn" id="btnPlay" title="播放/暂停 (空格)">▶</button>
        <button class="icon-btn" id="btnFwd10" title="前进 10 秒 (L)">10↻</button>
        <button class="icon-btn" id="btnNext" title="下一段 (→)">⏭</button>
      </div>

      <div class="ctrl-group">
        <label class="rate-box" title="播放倍速">
          <select id="rateSel" class="rate-sel">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
            <option value="8">8×</option>
          </select>
        </label>
        <button class="pill on" id="btnMute" title="声音 (M)">🔇</button>
        <button class="pill" id="btnShot" title="截图存 PNG">截图</button>
        <button class="pill" id="btnFull" title="全屏 (F)">全屏</button>
      </div>
    </section>

  </main>
</div>

<!-- 选择文件夹 -->
<div class="modal-mask" id="fsModal" hidden>
  <div class="modal fs-modal">
    <header class="fs-head">
      <h3>选择录像文件夹</h3>
      <button class="icon-btn" id="fsClose" title="关闭">✕</button>
    </header>

    <p class="fs-note">下面列的是<strong>运行服务的那台电脑</strong>上的磁盘；手机连同一网络时，选的也是这些盘。</p>

    <div class="fs-drives" id="fsDrives"></div>

    <div class="fs-pathbar">
      <button class="icon-btn" id="fsUp" title="上一级">↑</button>
      <input id="fsPath" readonly spellcheck="false">
    </div>

    <div class="fs-list" id="fsList"></div>

    <div class="fs-recent" id="fsRecent"></div>

    <div class="fs-extra">
      <div class="fs-extra-row">
        <button class="ghost-btn" id="fsUploadBtn">⬆ 上传本机视频</button>
        <input id="fsUploadInput" type="file" accept="video/*,.mp4,.mov,.m4v,.mkv,.avi" multiple hidden>
        <span class="fs-upload-state" id="fsUploadState"></span>
      </div>
      <div class="fs-net" id="fsNet"></div>
    </div>

    <footer class="fs-foot">
      <span class="fs-hint" id="fsHint">选中包含录像的目录，点右下角确认</span>
      <button class="pill" id="fsCancel">取消</button>
      <button class="pill on" id="fsOk">用这个文件夹</button>
    </footer>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
