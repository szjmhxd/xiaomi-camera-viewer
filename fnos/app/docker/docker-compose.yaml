# 飞牛托管的本应用 compose 项目。
# 镜像由 GitHub Actions 构建并发布到 ghcr；升级应用时飞牛会重新拉取。
# 如需换录像目录：在飞牛应用设置里改挂载，或直接改这一行的宿主机路径。
services:
  xiaomi-cam-viewer:
    image: ghcr.io/szjmhxd/xiaomi-camera-viewer:1.3.0
    container_name: xiaomi-cam-viewer
    restart: unless-stopped
    ports:
      - "18765:8765"
    volumes:
      # 录像目录（应用共享目录，文件管理里可见），只读挂载
      - /var/apps/xiaomi-cam-viewer/share/videos:/videos:ro
      # 转码缓存，放在应用数据目录，升级不丢
      - /var/apps/xiaomi-cam-viewer/var/cache:/cache
    environment:
      TZ: Asia/Shanghai
      CAM_CACHE_MAX_GB: "15"
