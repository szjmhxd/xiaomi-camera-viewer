# 摄像头回放台 — Docker Compose 部署
#
# 用法：
#   1. 把下面 CAM_ROOT 那一行左边的路径改成你 NAS 上存放录像的目录
#   2. docker compose up -d
#   3. 浏览器打开 http://NAS地址:8765/
#
# 想用本地源码构建镜像（不拉 ghcr），把 image 换成 build: .

services:
  xiaomi-cam:
    image: ghcr.io/szjmhxd/xiaomi-camera-viewer:latest
    # build: .
    container_name: xiaomi-cam-viewer
    restart: unless-stopped
    ports:
      # 左边是宿主机端口，被占用就改成 18765:8765 之类
      - "8765:8765"
    volumes:
      # 录像目录只读挂载；右边固定 /videos，不要改
      - "${CAM_ROOT:-/vol1/1000/xiaomi_camera_videos}:/videos:ro"
      # 转码缓存：删掉这个文件不影响录像，只影响二次播放是否秒开
      - "${CAM_CACHE_DIR:-./cache}:/cache"
    environment:
      TZ: Asia/Shanghai
      # 缓存上限（GB），超出按最久未用淘汰；设 0 表示不落盘缓存
      CAM_CACHE_MAX_GB: "20"
      # 转码参数：高度 / 帧率 / x264 质量（越小越清晰也越吃 CPU）
      CAM_HEIGHT: "720"
      CAM_FPS: "15"
      CAM_CRF: "26"
