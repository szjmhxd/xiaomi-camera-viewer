# 飞牛托管的本应用 compose 项目（config/resource → docker-project）。
# 镜像由 GitHub Actions 构建发布到 ghcr；升级应用时飞牛会重新拉取。
# 系统统一负责启动/停止，cmd/main 只做 status 查询。
#
# 挂载全是静态声明（官方 docker 模板同款写法，路径用 /var/apps/<app>/ 稳定软链）：
#   /videos  应用共享目录（config/resource 声明的 data-share），文件管理 → 应用文件 里可见
#   /nas     应用设置 → 授权目录勾选的文件夹（fnOS 官方的目录授权机制，只读，
#            录像原地不动）。平台把勾选结果放进系统变量 TRIM_DATA_ACCESSIBLE_PATHS，
#            cmd/sync_env 取其中第一个目录写进同目录 .env 的 NAS_DIR，
#            由 compose 的变量替换成挂载源。一次勾一个文件夹；
#            多个录像目录就勾它们共同的父目录。
#   /cache   转码缓存，放应用数据目录（var），升级不丢
services:
  xiaomi-cam-viewer:
    image: ghcr.io/szjmhxd/xiaomi-camera-viewer:1.3.2
    container_name: xiaomi-cam-viewer
    restart: unless-stopped
    ports:
      - "18765:8765"
    volumes:
      - /var/apps/xiaomi-cam-viewer/share/xiaomi-cam-viewer/videos:/videos:ro
      - "${NAS_DIR:-/var/apps/xiaomi-cam-viewer/share/xiaomi-cam-viewer/videos}:/nas:ro"
      - /var/apps/xiaomi-cam-viewer/var/cache:/cache
    environment:
      TZ: Asia/Shanghai
      CAM_CACHE_MAX_GB: "15"
