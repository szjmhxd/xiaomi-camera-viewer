# 飞牛托管的本应用 compose 项目。
# 镜像由 GitHub Actions 构建并发布到 ghcr；升级应用时飞牛会重新拉取。
#
# volumes 里成对的两行注释标记之间的内容由 cmd/apply_mounts 按平台下发的真实路径
# 生成（安装、升级、改授权目录时各写一次），不要手改。
# 想换录像目录：飞牛 → 应用 → 摄像头回放台 → 设置 → 授权目录，勾选你的录像文件夹，
# 然后重启应用；容器里会以只读方式挂成 /nas/1、/nas/2 ...，网页的文件夹选择器直接能选。
services:
  xiaomi-cam-viewer:
    image: ghcr.io/szjmhxd/xiaomi-camera-viewer:1.3.1
    container_name: xiaomi-cam-viewer
    restart: unless-stopped
    ports:
      - "18765:8765"
    volumes:
      # mounts-begin 由 cmd/apply_mounts 生成，勿手改
      - /var/apps/xiaomi-cam-viewer/share/xiaomi-cam-viewer/videos:/videos:ro
      - /usr/local/apps/@appdata/xiaomi-cam-viewer/cache:/cache
      # mounts-end
    environment:
      TZ: Asia/Shanghai
      CAM_CACHE_MAX_GB: "15"
